data:
  raw_path: data/raw/XAUUSD15min.csv
  processed_path: data/processed/XAUUSD15min_clean.parquet
  symbol: XAUUSD
  timeframe: 15min
  pip_size: 0.01          # Gold: smallest price move = $0.01 per oz

strategy:
  alma_length: 50
  alma_offset: 0.85
  alma_sigma: 6.0
  min_slope_atr: 0.05     # ATR-normalised slope threshold
  require_consecutive: 2  # Bars of consistent slope required
  atr_length: 20
  allow_shorts: true

risk:
  risk_pct: 0.75          # % of equity risked per trade
  sl_atr_mult: 2.0        # Stop-loss distance = ATR × mult
  tp_atr_mult: 4.0        # Take-profit distance = ATR × mult
  max_hold_bars: 50       # Time-stop in bars
  max_daily_loss_pct: 5.0 # Circuit-breaker (% of start-of-day equity)

execution:
  spread_pips: 3.0        # Fixed spread (pips)
  slippage_pips: 1.0      # Random slippage cap (pips)
  commission_per_lot: 7.0 # USD per round-turn standard lot

backtest:
  initial_equity: 10000.0
  lot_size: 100           # 1 standard lot = 100 troy oz (XAUUSD convention)

hmm:
  n_states: 2          # 2 = trend vs range
  lookback: 2000       # bars of history per HMM fit (~3 weeks of 15min data)
  refit_every: 500     # refit every 500 bars (~5 trading days)
  n_iter: 100          # EM iterations

session_filters:
  enabled: true
  london:
    enabled: true
    start: "08:00"
    end:   "16:30"
  new_york:
    enabled: true
    start: "13:30"
    end:   "21:00"
  tokyo:
    enabled: false
    start: "00:00"
    end:   "09:00"
